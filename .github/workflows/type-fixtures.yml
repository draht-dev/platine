name: Type Fixtures

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

# This job runs the mis-wire tsc fixture suite.
# fixtures/miswire/ contains intentionally broken workflows; tsc MUST error at
# the exact expected lines — this gate locks the "readable error at the right location"
# guarantee, which regresses silently if the builder API shape changes.

jobs:
  type-fixtures:
    name: mis-wire fixture tsc gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @draht/core (required for fixture type resolution)
        run: pnpm --filter @draht/core build

      - name: Run mis-wire fixture suite
        run: pnpm --filter @draht/fixtures-miswire test
