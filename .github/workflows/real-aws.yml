name: Real AWS Conformance

# Deploys a throwaway SST stage (examples/reference-playbook) and runs the
# @draht/conformance harness, which proves:
#   - T3: HTTP submission → deterministic runId → SQS → executor DAG runs
#   - T5: an in-flight run held at an approval survives a full `sst deploy`
#   - T6: an approval-gated tool holds → APPROVAL# row → IAM-auth resume → completed
#
# Neutral-skip: this job only runs when the `AWS_CI_ROLE_ARN` repo variable is
# set (see conformance/README.md — this is a USER ACTION: provision a
# throwaway AWS account/role and set the variable before this job will ever
# execute). On pull_request it ALSO requires the `real-aws` label, to avoid
# burning the gate's minutes on every push.
#
# Teardown ALWAYS runs (`if: always()`), independent of whether the harness
# itself passed, failed, or crashed — see conformance/src/teardown.ts.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  id-token: write
  contents: read

concurrency:
  group: real-aws
  cancel-in-progress: false

jobs:
  real-aws:
    name: deploy throwaway stage + conformance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Fork PRs never run: pull_request (not _target) already denies forks an OIDC
    # token, and the same-repo guard below skips them outright (defense-in-depth).
    if: ${{ vars.AWS_CI_ROLE_ARN != '' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'real-aws'))) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Sanity check — sst CLI resolves
        run: pnpm exec sst version

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_CI_REGION || 'eu-central-1' }}

      - name: Run conformance harness (deploy → checks → teardown)
        timeout-minutes: 18
        run: >
          pnpm conformance:real-aws --
          --stage ci-${{ github.run_id }}
          --region ${{ vars.AWS_CI_REGION || 'eu-central-1' }}
          --dir examples/reference-playbook

      - name: Guaranteed teardown
        if: always()
        run: >
          pnpm exec tsx conformance/src/teardown-cli.ts
          --stage ci-${{ github.run_id }}
          --region ${{ vars.AWS_CI_REGION || 'eu-central-1' }}
          --dir examples/reference-playbook
