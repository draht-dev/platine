name: Real AWS Conformance

# STUB — P7 gate. Do not enable until P6 (SST component) is complete.
# This workflow deploys a throwaway SST stage and runs the redelivery+redeploy
# conformance harness that verifies:
#   - in-flight runs survive a Lambda cold redeploy and resume from the last checkpoint
#   - redelivered SQS messages do NOT re-execute completed steps (idempotency ledger)
#   - approval-gated tools hold → surface in queue → resume on approve
#
# Prerequisites before enabling:
#   1. AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY + AWS_REGION secrets in the repo.
#   2. A throwaway AWS account / stage for CI (NOT fr3n's production account).
#   3. SST component (P6) deployed and tested.
#   4. The conformance harness scripts in packages/runtime-aws/test/conformance/.
#
# IMPORTANT: dev MemoryQueue cannot surface at-least-once async-flush ordering races
# (per design §4). Only a real deployed stage proves correctness.

on:
  workflow_dispatch: # manual trigger only until fully wired

jobs:
  real-aws:
    name: deploy throwaway stage + conformance
    runs-on: ubuntu-latest
    if: false # STUB: disabled — see comments above
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

