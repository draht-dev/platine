name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main]

jobs:
  ci:
    name: typecheck + test + build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['24']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Typecheck is build-free: tsgo (TypeScript 7) resolves @draht/* to source via
      # the centralized paths in tsconfig.base.json, so it needs no prior build.
      - name: Typecheck
        run: pnpm -r exec tsgo --noEmit

      - name: Test
        run: pnpm test

      # Root `pnpm test` only globs packages/*/src — the conformance package's
      # offline unit tests (output parsing, teardown ordering, check registry)
      # need their own invocation or they silently bit-rot.
      - name: Conformance unit tests
        run: pnpm -F @draht/conformance test

      - name: Build
        run: pnpm build

      # Offline conformance smoke test — zero AWS, zero network. Exercises the
      # same deploy → CHECKS (t3/t6-hold/t5-redeploy/t6-resume) → teardown
      # sequence the real-aws.yml gate runs, against an in-memory simulation.
      # Runs AFTER build: harness.ts imports @draht/runtime-aws + @draht/platine
      # by their package.json "exports" (dist/*), which only exist post-build.
      - name: Conformance dry-run
        run: pnpm conformance:dry-run
